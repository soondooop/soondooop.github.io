<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정처기 퀴즈</title>
<style>
:root{
  --bg:#f3efe6; --ink:#1c1914; --muted:#6b6458; --line:#d9d1c2;
  --paper:#fffdf8; --accent:#0f6b5c; --accent-2:#c45c26; --bad:#9b2c2c; --ok:#0f6b5c;
  --chip:#efe8d8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.5}
body{min-height:100vh}
.wrap{width:min(760px,100%);margin:0 auto;padding:28px 18px 64px}
header{margin-bottom:22px}
header h1{font-size:28px;letter-spacing:-.04em}
header p{color:var(--muted);margin-top:6px;font-size:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px}
label.k{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}
label.k:first-child{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip,button.opt,button.btn{
  border:1px solid var(--line);background:var(--chip);color:var(--ink);
  border-radius:999px;padding:8px 12px;font:inherit;cursor:pointer
}
.chip.is-on,button.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.btn{border-radius:12px;padding:12px 16px;font-weight:700}
button.btn.ghost{background:transparent}
button.opt{
  width:100%;text-align:left;border-radius:12px;padding:14px 16px;background:#fff;
  font-size:15px
}
button.opt:hover{border-color:var(--accent)}
button.opt.is-ok{background:#e7f4f1;border-color:var(--ok);color:var(--ok)}
button.opt.is-bad{background:#fbeaea;border-color:var(--bad);color:var(--bad)}
button.opt:disabled{cursor:default}
.write-box{display:flex;gap:8px;flex-wrap:wrap}
.write-box input{
  flex:1;min-width:200px;padding:14px 16px;font:inherit;font-size:16px;
  border:1px solid var(--line);border-radius:12px;background:#fff
}
.write-box input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.write-note{font-size:13px;color:var(--muted);margin-top:8px}
.progress{height:6px;background:var(--chip);border-radius:99px;overflow:hidden;margin:8px 0 16px}
.progress>i{display:block;height:100%;width:0;background:var(--accent)}
.q-cat{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.q-text{font-size:20px;font-weight:700;letter-spacing:-.03em;margin:8px 0 16px;white-space:pre-wrap}
.meta{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);color:var(--muted);font-size:14px;display:none}
.meta.is-on{display:block}
.meta b{color:var(--ink)}
.score{font-size:48px;font-weight:800;letter-spacing:-.05em}
.foot{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.hidden{display:none}
.stat{display:flex;gap:16px;color:var(--muted);font-size:14px;margin-bottom:8px}
kbd{font:12px/1 ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:#fff}
.tabs{display:flex;gap:8px;margin-top:14px}
.tab{border-radius:12px}
.q-text.is-exam{font-size:16px;font-weight:500}
.q-text.is-exam p{margin:0 0 10px}
.q-text img{max-width:100%;height:auto;border-radius:8px;margin:8px 0;border:1px solid var(--line)}
.write-box textarea{
  width:100%;min-height:96px;padding:12px 14px;font:inherit;font-size:16px;
  border:1px solid var(--line);border-radius:12px;background:#fff;resize:vertical
}
.write-box textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.src-link{font-size:12px;color:var(--muted);margin-top:8px}
.src-link a{color:var(--accent)}
.year-lab{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px;width:100%}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>정처기 퀴즈</h1>
    <p>암기 카드와 실기 기출을 회차별로 풀니다. 주관식은 입력 후 <kbd>Enter</kbd></p>
    <div class="tabs">
      <button class="chip tab is-on" data-tab="memo">암기 카드</button>
      <button class="chip tab" data-tab="exam">실전 기출</button>
    </div>
  </header>
  <section class="panel" id="setup">
    <label class="k">범위</label>
    <div class="row" id="cats"></div>
    <label class="k">방식</label>
    <div class="row" id="modes">
      <button class="chip is-on" data-mode="term">정의 보고 용어 고르기</button>
      <button class="chip" data-mode="def">용어 보고 정의 고르기</button>
      <button class="chip" data-mode="write">주관식 (용어 쓰기)</button>
      <button class="chip" data-mode="ox">O / X</button>
    </div>
    <label class="k">문항 수</label>
    <div class="row" id="counts">
      <button class="chip is-on" data-n="10">10</button>
      <button class="chip" data-n="20">20</button>
      <button class="chip" data-n="40">40</button>
      <button class="chip" data-n="0">전체</button>
    </div>
    <div class="foot">
      <button class="btn primary" id="start">퀴즈 시작</button>
      <button class="btn ghost" id="wrongStart">오답만 다시</button>
    </div>
  </section>
  <section class="panel hidden" id="examSetup">
    <label class="k">회차 · 2020년 1회 ~ 2026년 2회, 회차당 20문항</label>
    <div id="examRounds"></div>
    <label class="k">순서</label>
    <div class="row" id="examOrders">
      <button class="chip is-on" data-order="seq">1번부터 차례로</button>
      <button class="chip" data-order="rand">랜덤</button>
    </div>
    <p class="write-note">채점 전에는 답이 보이지 않습니다. 공식 답과 해설은 제출 후에만 나옵니다. 출처: chobopark.tistory.com 복원글</p>
    <div class="foot">
      <button class="btn primary" id="examStart">이 회차 풀기</button>
      <button class="btn ghost" id="examWrong">기출 오답만 다시</button>
    </div>
  </section>
  <section class="panel hidden" id="quiz">
    <div class="stat"><span id="pos"></span><span id="live"></span></div>
    <div class="progress"><i id="bar"></i></div>
    <div class="q-cat" id="qcat"></div>
    <div class="q-text" id="qtext"></div>
    <div class="row" id="opts" style="flex-direction:column"></div>
    <div class="meta" id="explain"></div>
    <div class="foot">
      <button class="btn primary hidden" id="next">다음</button>
      <button class="btn ghost hidden" id="markOk">부분 정답으로 바꾸기</button>
      <button class="btn ghost" id="quit">그만두기</button>
    </div>
  </section>
  <section class="panel hidden" id="result">
    <div class="q-cat">결과</div>
    <div class="score" id="score"></div>
    <p id="summary" style="color:var(--muted);margin:8px 0 16px"></p>
    <div id="miss"></div>
    <div class="foot">
      <button class="btn primary" id="again">같은 설정으로 다시</button>
      <button class="btn ghost" id="home">처음으로</button>
    </div>
  </section>
</div>
<script src="exams-2020.js"></script>
<script src="exams-2021.js"></script>
<script src="exams-2022.js"></script>
<script src="exams-2023.js"></script>
<script src="exams-2024.js"></script>
<script src="exams-2025.js"></script>
<script src="exams-2026.js"></script>
<script src="cards-data.js"></script>
<script src="exams-data.js"></script>
<script src="app.js"></script>
</body>
</html>
