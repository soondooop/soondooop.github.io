<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정처기 퀴즈</title>
<style>
:root{
  --bg:#f3efe6; --ink:#1c1914; --muted:#6b6458; --line:#d9d1c2;
  --paper:#fffdf8; --accent:#0f6b5c; --accent-2:#c45c26; --bad:#9b2c2c; --ok:#0f6b5c;
  --chip:#efe8d8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.5}
body{min-height:100vh}
.wrap{width:min(760px,100%);margin:0 auto;padding:28px 18px 64px}
header{margin-bottom:22px}
header h1{font-size:28px;letter-spacing:-.04em}
header p{color:var(--muted);margin-top:6px;font-size:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px}
label.k{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}
label.k:first-child{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip,button.opt,button.btn{
  border:1px solid var(--line);background:var(--chip);color:var(--ink);
  border-radius:999px;padding:8px 12px;font:inherit;cursor:pointer
}
.chip.is-on,button.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.btn{border-radius:12px;padding:12px 16px;font-weight:700}
button.btn.ghost{background:transparent}
button.opt{
  width:100%;text-align:left;border-radius:12px;padding:14px 16px;background:#fff;
  font-size:15px
}
button.opt:hover{border-color:var(--accent)}
button.opt.is-ok{background:#e7f4f1;border-color:var(--ok);color:var(--ok)}
button.opt.is-bad{background:#fbeaea;border-color:var(--bad);color:var(--bad)}
button.opt:disabled{cursor:default}
.write-box{display:flex;gap:8px;flex-wrap:wrap}
.write-box input{
  flex:1;min-width:200px;padding:14px 16px;font:inherit;font-size:16px;
  border:1px solid var(--line);border-radius:12px;background:#fff
}
.write-box input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.write-note{font-size:13px;color:var(--muted);margin-top:8px}
.progress{height:6px;background:var(--chip);border-radius:99px;overflow:hidden;margin:8px 0 16px}
.progress>i{display:block;height:100%;width:0;background:var(--accent)}
.q-cat{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.q-text{font-size:20px;font-weight:700;letter-spacing:-.03em;margin:8px 0 16px;white-space:pre-wrap}
.meta{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);color:var(--muted);font-size:14px;display:none}
.meta.is-on{display:block}
.meta b{color:var(--ink)}
.score{font-size:48px;font-weight:800;letter-spacing:-.05em}
.foot{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.hidden{display:none}
.stat{display:flex;gap:16px;color:var(--muted);font-size:14px;margin-bottom:8px}
kbd{font:12px/1 ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:#fff}
.tabs{display:flex;gap:8px;margin-top:14px}
.tab{border-radius:12px}
.q-text.is-exam{font-size:16px;font-weight:500}
.q-text.is-exam p{margin:0 0 10px}
.q-text img{max-width:100%;height:auto;border-radius:8px;margin:8px 0;border:1px solid var(--line)}
.q-text pre.code{
  white-space:pre;overflow:auto;font-family:ui-monospace,Consolas,monospace;
  font-size:13px;font-weight:400;line-height:1.45;background:#f6f1e6;
  padding:12px;border-radius:8px;margin:10px 0
}
.q-text table{width:100%;border-collapse:collapse;font-size:13px;font-weight:400;margin:10px 0}
.q-text td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.write-box textarea{
  width:100%;min-height:96px;padding:12px 14px;font:inherit;font-size:16px;
  border:1px solid var(--line);border-radius:12px;background:#fff;resize:vertical
}
.write-box textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.src-link{font-size:12px;color:var(--muted);margin-top:8px}
.src-link a{color:var(--accent)}
.year-lab{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px;width:100%}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>정처기 퀴즈</h1>
    <p>암기 카드와 실기 기출을 회차별로 풀니다. 주관식은 입력 후 <kbd>Enter</kbd></p>
    <div class="tabs">
      <button class="chip tab is-on" data-tab="memo">암기 카드</button>
      <button class="chip tab" data-tab="exam">실전 기출</button>
    </div>
  </header>

  <section class="panel" id="setup">
    <label class="k">범위</label>
    <div class="row" id="cats"></div>
    <label class="k">방식</label>
    <div class="row" id="modes">
      <button class="chip is-on" data-mode="term">정의 보고 용어 고르기</button>
      <button class="chip" data-mode="def">용어 보고 정의 고르기</button>
      <button class="chip" data-mode="write">주관식 (용어 쓰기)</button>
      <button class="chip" data-mode="ox">O / X</button>
    </div>
    <label class="k">문항 수</label>
    <div class="row" id="counts">
      <button class="chip is-on" data-n="10">10</button>
      <button class="chip" data-n="20">20</button>
      <button class="chip" data-n="40">40</button>
      <button class="chip" data-n="0">전체</button>
    </div>
    <div class="foot">
      <button class="btn primary" id="start">퀴즈 시작</button>
      <button class="btn ghost" id="wrongStart">오답만 다시</button>
    </div>
  </section>

  <section class="panel hidden" id="examSetup">
    <label class="k">회차 · 2020년 1회 ~ 2026년 2회, 회차당 20문항</label>
    <div id="examRounds"></div>
    <label class="k">순서</label>
    <div class="row" id="examOrders">
      <button class="chip is-on" data-order="seq">1번부터 차례로</button>
      <button class="chip" data-order="rand">랜덤</button>
    </div>
    <p class="write-note">채점 전에는 답이 보이지 않습니다. 공식 답과 해설은 제출 후에만 나옵니다. 출처: chobopark.tistory.com 복원글</p>
    <div class="foot">
      <button class="btn primary" id="examStart">이 회차 풀기</button>
      <button class="btn ghost" id="examWrong">기출 오답만 다시</button>
    </div>
  </section>

  <section class="panel hidden" id="quiz">
    <div class="stat"><span id="pos"></span><span id="live"></span></div>
    <div class="progress"><i id="bar"></i></div>
    <div class="q-cat" id="qcat"></div>
    <div class="q-text" id="qtext"></div>
    <div class="row" id="opts" style="flex-direction:column"></div>
    <div class="meta" id="explain"></div>
    <div class="foot">
      <button class="btn primary hidden" id="next">다음</button>
      <button class="btn ghost hidden" id="markOk">부분 정답으로 바꾸기</button>
      <button class="btn ghost" id="quit">그만두기</button>
    </div>
  </section>

  <section class="panel hidden" id="result">
    <div class="q-cat">결과</div>
    <div class="score" id="score"></div>
    <p id="summary" style="color:var(--muted);margin:8px 0 16px"></p>
    <div id="miss"></div>
    <div class="foot">
      <button class="btn primary" id="again">같은 설정으로 다시</button>
      <button class="btn ghost" id="home">처음으로</button>
    </div>
  </section>
</div>
<script src="exams-2020.js"></script>
<script src="exams-2021.js"></script>
<script src="exams-2022.js"></script>
<script src="exams-2023.js"></script>
<script src="exams-2024.js"></script>
<script src="exams-2025.js"></script>
<script src="exams-2026.js"></script>
<script src="cards-data.js"></script>
<script src="exams-data.js"></script>
<script>
const EXAM_DATA = (typeof EXAMS === "undefined") ? {} : EXAMS;
const LS = "jungchegi-wrong-v1";
const LS_EX = "jungchegi-exam-wrong-v1";
const $ = (id) => document.getElementById(id);

const cats = [...new Set(CARDS.map(c => c.cat))];
const examRounds = Object.keys(EXAM_DATA);
let selected = new Set(cats);
let mode = "term";
let count = 10;
let queue = [];
let i = 0;
let correct = 0;
let misses = [];
let answered = false;
let cur = null;
let app = "memo";
let examRound = examRounds.includes("2026년 2회") ? "2026년 2회" : (examRounds[0] || "");
let examOrder = "seq";
let lastExamWrong = false;

function shuffle(a){
  const x = a.slice();
  for (let n = x.length - 1; n > 0; n--) {
    const j = Math.floor(Math.random() * (n + 1));
    [x[n], x[j]] = [x[j], x[n]];
  }
  return x;
}
function pool(){
  const list = CARDS.filter(c => selected.has(c.cat));
  return list.length ? list : CARDS;
}
function loadWrong(){
  try { return JSON.parse(localStorage.getItem(LS) || "[]"); } catch { return []; }
}
function saveWrong(ids){
  localStorage.setItem(LS, JSON.stringify([...new Set(ids)].slice(-200)));
}
function loadExamWrong(){
  try { return JSON.parse(localStorage.getItem(LS_EX) || "[]"); } catch { return []; }
}
function saveExamWrong(ids){
  localStorage.setItem(LS_EX, JSON.stringify([...new Set(ids)].slice(-400)));
}

function setTab(tab){
  app = tab;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("is-on", b.dataset.tab === tab));
  $("setup").classList.toggle("hidden", tab !== "memo");
  $("examSetup").classList.toggle("hidden", tab !== "exam");
  $("quiz").classList.add("hidden");
  $("result").classList.add("hidden");
}
document.querySelector(".tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-tab]");
  if (!b) return;
  if (!$("quiz").classList.contains("hidden")) return;
  setTab(b.dataset.tab);
});

function renderExamRounds(){
  const byYear = {};
  examRounds.forEach(name => {
    const y = name.slice(0, 4);
    (byYear[y] ||= []).push(name);
  });
  $("examRounds").innerHTML = Object.keys(byYear).sort().map(y => {
    const chips = byYear[y].map(name =>
      `<button class="chip ${name===examRound?"is-on":""}" data-round="${name}">${name} (${(EXAM_DATA[name]||[]).length})</button>`
    ).join("");
    return `<div class="year-lab">${y}년</div><div class="row">${chips}</div>`;
  }).join("");
}
renderExamRounds();
$("examRounds").addEventListener("click", (e) => {
  const b = e.target.closest("[data-round]");
  if (!b) return;
  examRound = b.dataset.round;
  renderExamRounds();
});
$("examOrders").addEventListener("click", (e) => {
  const b = e.target.closest("[data-order]");
  if (!b) return;
  examOrder = b.dataset.order;
  [...$("examOrders").children].forEach(x => x.classList.toggle("is-on", x === b));
});

function compact(s){
  return String(s || "").toLowerCase().replace(/\s+/g, "").replace(/[()[\]{}'"`]/g, "");
}
function examAlts(official){
  return String(official || "")
    .split(/\n|\/|\bor\b|또는/i)
    .map(s => s.replace(/^\s*\d+\s*[\.．)]\s*/, "").replace(/^\s*[ㄱ-ㅎ]\s*[\.．]\s*/, "").trim())
    .filter(Boolean);
}
function gradeExam(typed, official){
  const t = compact(typed);
  if (!t) return false;
  const alts = examAlts(official).map(compact).filter(Boolean);
  if (alts.some(a => a === t)) return true;
  const o = compact(official);
  if (o && (o === t || (o.length >= 2 && (t.includes(o) || o.includes(t))))) return true;
  const long = alts.filter(a => a.length >= 2);
  if (long.length >= 2 && long.every(a => t.includes(a))) return true;
  return false;
}

function startExam(fromWrong){
  lastExamWrong = !!fromWrong;
  let src = (EXAM_DATA[examRound] || []).slice();
  if (fromWrong) {
    const ids = new Set(loadExamWrong());
    const all = examRounds.flatMap(r => EXAM_DATA[r] || []).filter(q => ids.has(q.id));
    const inRound = all.filter(q => q.round === examRound);
    src = inRound.length ? inRound : all;
    if (!src.length) { alert("저장된 기출 오답이 없습니다."); return; }
  }
  if (!src.length) { alert("이 회차 문항을 불러오지 못했습니다. exams-data.js를 같은 폴더에 두었는지 확인하세요."); return; }
  const ordered = examOrder === "rand" ? shuffle(src) : src.slice().sort((a,b) => a.n - b.n);
  queue = ordered.map(q => ({
    exam: true,
    write: true,
    card: {
      id: q.id,
      term: q.a,
      def: q.q,
      keys: "",
      ex: q.explain,
      hint: "",
      cat: q.round,
      n: q.n,
      html: q.html,
      src: q.src
    }
  }));
  i = 0; correct = 0; misses = [];
  $("setup").classList.add("hidden");
  $("examSetup").classList.add("hidden");
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  show();
}

function renderCats(){
  $("cats").innerHTML = `<button class="chip ${selected.size===cats.length?"is-on":""}" data-all="1">전체 ${CARDS.length}개</button>` +
    cats.map(c => {
      const n = CARDS.filter(x => x.cat === c).length;
      return `<button class="chip ${selected.has(c)?"is-on":""}" data-cat="${c}">${c} ${n}</button>`;
    }).join("");
}
renderCats();

$("cats").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.all) {
    selected = new Set(cats);
  } else {
    const c = b.dataset.cat;
    if (selected.size === cats.length) selected = new Set([c]);
    else if (selected.has(c) && selected.size > 1) selected.delete(c);
    else if (selected.has(c)) selected = new Set(cats);
    else selected.add(c);
  }
  renderCats();
});
$("modes").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  mode = b.dataset.mode;
  [...$("modes").children].forEach(x => x.classList.toggle("is-on", x === b));
});
$("counts").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  count = Number(b.dataset.n);
  [...$("counts").children].forEach(x => x.classList.toggle("is-on", x === b));
});

function pickChoices(card, key){
  const same = pool().filter(c => c.id !== card.id && c.cat === card.cat);
  const rest = pool().filter(c => c.id !== card.id);
  const src = shuffle(same.length >= 3 ? same : rest);
  const opts = shuffle([card, ...src.slice(0, 3)]);
  return opts.map(c => ({id: c.id, text: c[key], ok: c.id === card.id}));
}
function makeOX(card){
  const lie = shuffle(pool().filter(c => c.id !== card.id && c.cat === card.cat))[0]
    || shuffle(pool().filter(c => c.id !== card.id))[0];
  const truth = Math.random() < 0.5;
  const stmt = truth
    ? `${card.term}  →  ${card.def}`
    : `${card.term}  →  ${lie.def}`;
  return {card, ox: true, stmt, truth, choices: [
    {id: "O", text: "O (맞다)", ok: truth},
    {id: "X", text: "X (아니다)", ok: !truth}
  ]};
}
function makeItem(card){
  if (mode === "ox") return makeOX(card);
  if (mode === "write") return {card, prompt: card.def, write: true};
  if (mode === "def") {
    return {card, prompt: card.term, choices: pickChoices(card, "def")};
  }
  return {card, prompt: card.def, choices: pickChoices(card, "term")};
}

function norm(s){
  return String(s || "").toLowerCase()
    .replace(/[()[\]{}]/g, " ")
    .replace(/[^0-9a-z가-힣%+\-]/gi, "")
    .trim();
}
function aliases(card){
  const raw = [card.term, card.keys].filter(Boolean).join(" ");
  const out = new Set();
  const add = (s) => {
    const n = norm(s);
    if (n && n.length >= 2) out.add(n);
  };
  add(card.term);
  add(card.keys);
  raw.split(/[\/,;·|]/).forEach(add);
  (raw.match(/\(([^)]+)\)/g) || []).forEach(m => add(m.slice(1, -1)));
  (raw.match(/[A-Za-z][A-Za-z0-9 +\-]{1,}/g) || []).forEach(add);
  (raw.match(/[가-힣]{2,}/g) || []).forEach(add);
  return [...out];
}
function gradeWrite(answer, card){
  const a = norm(answer);
  if (!a) return false;
  return aliases(card).some(al => a === al || (a.length >= 3 && (al.includes(a) || a.includes(al))));
}

function start(fromWrong){
  let src = pool();
  if (fromWrong) {
    const ids = new Set(loadWrong());
    src = CARDS.filter(c => ids.has(c.id));
    if (!src.length) { alert("저장된 오답이 없습니다."); return; }
  }
  queue = shuffle(src).slice(0, count || src.length).map(makeItem);
  i = 0; correct = 0; misses = [];
  $("setup").classList.add("hidden");
  $("examSetup").classList.add("hidden");
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  show();
}

function modeLabel(){
  if (mode === "ox") return " · OX";
  if (mode === "def") return " · 정의 고르기";
  if (mode === "write") return " · 주관식";
  return " · 용어 고르기";
}
function show(){
  answered = false;
  cur = queue[i];
  $("pos").textContent = `${i+1} / ${queue.length}`;
  $("live").textContent = `정답 ${correct}`;
  $("bar").style.width = ((i / queue.length) * 100) + "%";
  $("markOk").classList.add("hidden");
  if (cur.exam) {
    $("qcat").textContent = `${cur.card.cat} · ${cur.card.n}번`;
    $("qtext").classList.add("is-exam");
    $("qtext").innerHTML = cur.card.html || `<p>${escapeHtml(cur.card.def)}</p>`;
    $("opts").innerHTML =
      `<div class="write-box" style="flex-direction:column">
        <textarea id="ans" autocomplete="off" placeholder="답을 작성하세요. 여러 칸이면 줄을 바꾸 적어도 됩니다."></textarea>
        <button class="btn primary" id="submit">채점</button>
      </div>
      <p class="write-note">채점 전에는 답이 보이지 않습니다. 줄바꿈은 Shift+Enter, 채점은 Enter.</p>`;
  } else {
    $("qcat").textContent = cur.card.cat + modeLabel();
    $("qtext").classList.remove("is-exam");
    $("qtext").textContent = cur.ox ? cur.stmt : cur.prompt;
    if (cur.write) {
      $("opts").innerHTML =
        `<div class="write-box">
          <input id="ans" autocomplete="off" placeholder="용어를 입력하세요 (한글 또는 영문)">
          <button class="btn primary" id="submit">채점</button>
        </div>
        <p class="write-note">실기처럼 단답으로 쓰면 됩니다. Factory Method, 팩토리 메소드처럼 한글·영문 모두 인정합니다.</p>`;
    } else {
      $("opts").innerHTML = cur.choices.map((c, idx) =>
        `<button class="opt" data-i="${idx}"><b>${idx+1}.</b> ${escapeHtml(c.text)}</button>`
      ).join("");
    }
  }
  const submit = $("submit");
  if (submit) submit.onclick = submitWrite;
  setTimeout(() => { const el = $("ans"); if (el) el.focus(); }, 0);
  $("explain").classList.remove("is-on");
  $("next").classList.add("hidden");
  $("next").textContent = i === queue.length - 1 ? "결과 보기" : "다음";
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
}

function reveal(ok, typed){
  answered = true;
  if (ok) correct += 1;
  else misses.push(cur);
  const c = cur.card;
  if (cur.exam) {
    $("explain").innerHTML =
      (typed ? `<b>내 답</b> ${escapeHtml(typed).replace(/\n/g,"<br>")}<br>` : "") +
      `<b>정답</b> ${escapeHtml(c.term).replace(/\n/g,"<br>")}` +
      (c.ex ? `<br><b>해설</b> ${escapeHtml(c.ex).replace(/\n/g,"<br>")}` : "") +
      (c.src ? `<div class="src-link"><a href="${escapeHtml(c.src)}" target="_blank" rel="noopener">원문 보기</a></div>` : "");
  } else {
    $("explain").innerHTML =
      (typed ? `<b>내 답</b> ${escapeHtml(typed)}<br>` : "") +
      `<b>정답</b> ${escapeHtml(c.term)}<br>${escapeHtml(c.def)}` +
      (c.keys ? `<br><b>키워드</b> ${escapeHtml(c.keys)}` : "") +
      (c.ex ? `<br><b>예</b> ${escapeHtml(c.ex)}` : "") +
      (c.hint ? `<br><b>암기</b> ${escapeHtml(c.hint)}` : "");
  }
  $("explain").classList.add("is-on");
  $("next").classList.remove("hidden");
  if (!ok && cur.write) $("markOk").classList.remove("hidden");
}
function submitWrite(){
  if (answered) return;
  const input = $("ans");
  const typed = (input && input.value || "").trim();
  if (!typed) { if (input) input.focus(); return; }
  if (input) input.disabled = true;
  const btn = $("submit");
  if (btn) btn.disabled = true;
  const ok = cur.exam ? gradeExam(typed, cur.card.term) : gradeWrite(typed, cur.card);
  reveal(ok, typed);
}
function choose(idx){
  if (answered || !cur || cur.write) return;
  const choice = cur.choices[idx];
  const buttons = [...$("opts").querySelectorAll("button")];
  buttons.forEach((b, n) => {
    b.disabled = true;
    if (cur.choices[n].ok) b.classList.add("is-ok");
    if (n === idx && !choice.ok) b.classList.add("is-bad");
  });
  reveal(choice.ok, "");
}

function finish(){
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  const pct = Math.round((correct / queue.length) * 100) || 0;
  $("score").textContent = `${correct} / ${queue.length}`;
  $("summary").textContent = `정답률 ${pct}% · ${pct >= 80 ? "합격권입니다." : pct >= 60 ? "한 바퀴 더 보면 됩니다." : "오답부터 다시 보세요."}`;
  if (app === "exam") {
    $("miss").innerHTML = misses.length
      ? `<label class="k">오답 ${misses.length}</label>` + misses.map(m =>
          `<p style="margin:0 0 10px;font-size:14px"><b>${escapeHtml(m.card.cat)} ${m.card.n}번</b> — ${escapeHtml(m.card.term)}</p>`
        ).join("")
      : "<p>오답이 없습니다.</p>";
    const prev = loadExamWrong().filter(id => !queue.some(q => q.card.id === id && !misses.some(m => m.card.id === id)));
    saveExamWrong([...prev, ...misses.map(m => m.card.id)]);
  } else {
    $("miss").innerHTML = misses.length
      ? `<label class="k">오답 ${misses.length}</label>` + misses.map(m =>
          `<p style="margin:0 0 10px;font-size:14px"><b>${escapeHtml(m.card.term)}</b> — ${escapeHtml(m.card.def)}</p>`
        ).join("")
      : "<p>오답이 없습니다.</p>";
    const prev = loadWrong().filter(id => !queue.some(q => q.card.id === id && !misses.some(m => m.card.id === id)));
    saveWrong([...prev, ...misses.map(m => m.card.id)]);
  }
}

$("start").onclick = () => start(false);
$("wrongStart").onclick = () => start(true);
$("examStart").onclick = () => startExam(false);
$("examWrong").onclick = () => startExam(true);
$("next").onclick = () => { if (i >= queue.length - 1) finish(); else { i += 1; show(); } };
$("quit").onclick = finish;
$("again").onclick = () => { if (app === "exam") startExam(lastExamWrong); else start(false); };
$("markOk").onclick = () => {
  if (!cur || !misses.includes(cur)) return;
  misses = misses.filter(m => m !== cur);
  correct += 1;
  $("live").textContent = `정답 ${correct}`;
  $("markOk").classList.add("hidden");
};
$("home").onclick = () => {
  $("result").classList.add("hidden");
  $("quiz").classList.add("hidden");
  setTab(app);
};
$("opts").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-i]");
  if (b) choose(Number(b.dataset.i));
});
document.addEventListener("keydown", (e) => {
  if ($("quiz").classList.contains("hidden")) return;
  if (e.key === "Enter") {
    if (e.shiftKey && cur && cur.exam) return;
    e.preventDefault();
    if (!answered && cur && cur.write) submitWrite();
    else if (answered) $("next").click();
    return;
  }
  if (!answered && cur && !cur.write && ["1","2","3","4"].includes(e.key)) choose(Number(e.key) - 1);
});
</script>
</body>
</html>
